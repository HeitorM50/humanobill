[package]
name = "humanobill-api"
description = "API HTTP (Axum)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
humanobill-core = { version = "0.1.0", path = "../core" }
humanobill-extract = { version = "0.1.0", path = "../extract" }
humanobill-rules = { version = "0.1.0", path = "../rules" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
