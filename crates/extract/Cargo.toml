[package]
name = "humanobill-extract"
description = "Extração de faturas via IA (Gemini)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
humanobill-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
