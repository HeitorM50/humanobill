<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HumanoBill — referência visual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap">
<style>
/* Layout: barra fixa com alternador; cada direção é uma coluna de pranchetas (tela principal, resultado, componentes, tokens). */
:root{
  --sh-bg:#eef0f3; --sh-fg:#171a21; --sh-muted:#5a6170; --sh-line:#d3d7de; --sh-panel:#ffffff; --sh-on:#171a21; --sh-on-fg:#ffffff;
  --sh-font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh-bg:#14161b;--sh-fg:#eceef2;--sh-muted:#a2a9b6;--sh-line:#30343d;--sh-panel:#1d2027;--sh-on:#eceef2;--sh-on-fg:#14161b;color-scheme:dark}}
:root[data-theme="dark"]{--sh-bg:#14161b;--sh-fg:#eceef2;--sh-muted:#a2a9b6;--sh-line:#30343d;--sh-panel:#1d2027;--sh-on:#eceef2;--sh-on-fg:#14161b;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--sh-bg);color:var(--sh-fg);font-family:var(--sh-font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sh-bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{padding-block:28px 12px;max-width:70ch}
.intro h1{font-size:26px;line-height:1.15;margin:0 0 8px;font-weight:700;text-wrap:balance}
.intro p{margin:0;color:var(--sh-muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sh-bg);border-bottom:1px solid var(--sh-line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;padding-block:10px;align-items:center}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--sh-line);border-radius:8px;overflow:hidden;background:var(--sh-panel)}
.seg button{font:inherit;font-weight:600;color:var(--sh-fg);background:none;border:0;padding:8px 14px;min-height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--sh-line)}
.seg button[aria-pressed="true"]{background:var(--sh-on);color:var(--sh-on-fg)}
.seg button:focus-visible{outline:3px solid #4c7dff;outline-offset:-3px}
.stage{padding-block:20px 48px}
.cols{display:flex;gap:24px;align-items:flex-start}
.stage[data-mode="all"] .cols{overflow-x:auto;padding-bottom:12px}
.stage[data-mode="all"] .col{flex:0 0 min(390px,86vw)}
.stage:not([data-mode="all"]) .col{flex:1 1 auto;min-width:0;margin-inline:auto;max-width:1120px}
.stage[data-width="phone"]:not([data-mode="all"]) .col{max-width:390px}
.col{display:flex;flex-direction:column;gap:14px}
.col>header h2{margin:0;font-size:20px;line-height:1.2}
.col>header p{margin:4px 0 0;color:var(--sh-muted);max-width:68ch}
.cap{font-size:13px;font-weight:600;color:var(--sh-muted);margin:10px 0 -6px}
.proscons{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));background:var(--sh-panel);border:1px solid var(--sh-line);border-radius:8px;padding:14px 16px}
.proscons h3{margin:0 0 2px;font-size:13px;color:var(--sh-muted);font-weight:600}
.proscons p{margin:0}

/* ---------- pranchetas: tokens por direção ---------- */
.board{container-type:inline-size;border:1px solid var(--sh-line);border-radius:10px;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.5;font-variant-numeric:tabular-nums}
.d-a{--p:#0B5D4B;--p-strong:#084436;--p-soft:#E3F1EC;--on-p:#fff;--bg:#F6F8F7;--surface:#fff;--ink:#10201B;--muted:#4D5F58;--line:#D9E2DE;--bw:1px;
  --danger:#B42318;--danger-soft:#FDECEA;--warn:#8A4B08;--warn-soft:#FFF4D6;--ok:#15683A;--ok-soft:#E4F5EA;--focus:#0B5D4B;
  --r:12px;--r-s:10px;--fs:16px;--display:"Geist",ui-sans-serif,system-ui,sans-serif;--body:"Geist",ui-sans-serif,system-ui,sans-serif;--dw:700;--dls:-.025em}
.d-b,.d-d{--p:#1B2A6B;--p-strong:#121D4D;--p-soft:#E8EBF7;--on-p:#fff;--bg:#FBFAF7;--surface:#fff;--ink:#161B33;--muted:#545A75;--line:#DEDCD3;--bw:1px;--hl:#FFE45C;
  --danger:#C0271D;--danger-soft:#FBE9E7;--warn:#8A5A00;--warn-soft:#FFF3C9;--ok:#1F6B45;--ok-soft:#E3F3EA;--focus:#1B2A6B;
  --r:8px;--r-s:6px;--fs:17px;--display:"Bricolage Grotesque","Trebuchet MS",ui-sans-serif,sans-serif;--body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Verdana,ui-sans-serif,sans-serif;--dw:700;--dls:-.02em}
.d-c{--p:#1F3FD6;--p-strong:#162FA6;--p-soft:#E7ECFF;--on-p:#fff;--bg:#fff;--surface:#fff;--ink:#0A1230;--muted:#454C66;--line:#0A1230;--bw:2px;
  --danger:#D92D20;--danger-soft:#FEE9E7;--warn:#B25E09;--warn-soft:#FFF1DC;--ok:#177245;--ok-soft:#E2F4EA;--focus:#0A1230;
  --r:4px;--r-s:4px;--fs:16px;--display:"Archivo","Arial Black",ui-sans-serif,sans-serif;--body:"Archivo",Arial,ui-sans-serif,sans-serif;--dw:800;--dls:-.02em}

.board h3,.board h4,.board p,.board ul,.board ol{margin:0}
.board ul,.board ol{padding:0;list-style:none}
.pad{padding:20px}
.disp{font-family:var(--display);font-weight:var(--dw);letter-spacing:var(--dls);line-height:1.05;text-wrap:balance}
.d-c .disp{font-stretch:118%}
.muted{color:var(--muted)}
.small{font-size:.82em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.between{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.between>:first-child{min-width:0}
.nowrap{white-space:nowrap}

/* navegação */
.nav{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:var(--bw) solid var(--line)}
.brand{font-family:var(--display);font-weight:var(--dw);font-size:19px;letter-spacing:var(--dls);color:var(--p);margin-right:auto;display:flex;align-items:center;gap:8px}
.d-b .brand span{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.d-c .nav{background:var(--ink);border-bottom:0}.d-c .brand{color:#fff}.d-c .nav a{color:#fff}
.nav a{color:var(--ink);font-weight:500;text-decoration:none;display:none}
.aplus{font:inherit;font-weight:700;min-width:44px;min-height:44px;border-radius:var(--r-s);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink)}
.d-c .aplus{border-color:#fff;background:transparent;color:#fff}
@container (min-width:640px){.nav a{display:inline}}

/* botões */
.btn{font:inherit;font-weight:600;min-height:48px;padding:10px 20px;border-radius:var(--r-s);border:var(--bw) solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background-color .15s,border-color .15s,transform .05s;text-decoration:none}
.btn.pri{background:var(--p);color:var(--on-p)}
.btn.pri:hover,.btn.pri.is-hover{background:var(--p-strong)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.d-b .btn.sec{border:1.5px solid var(--p);color:var(--p)}
.btn.sec:hover,.btn.sec.is-hover{background:var(--p-soft)}
.btn.ter{background:var(--p-soft);color:var(--p-strong)}
.d-b .btn.ter{background:var(--hl);color:var(--ink)}
.btn.ter:hover,.btn.ter.is-hover{filter:brightness(.95)}
.btn.gho{background:transparent;color:var(--p);padding-inline:10px}
.btn.gho:hover,.btn.gho.is-hover{text-decoration:underline;text-underline-offset:3px;background:var(--p-soft)}
.btn:focus-visible,.btn.is-focus,.field input:focus-visible,.aplus:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn:active,.btn.is-active{transform:translateY(1px)}
.btn.pri.is-active{background:var(--p-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.inv{background:#fff;color:var(--ink)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}.btn{transition:none}}
.states{overflow-x:auto}
.states table{border-collapse:separate;border-spacing:8px 10px;margin:-10px -8px}
.states th{font-weight:500;font-size:13px;color:var(--muted);text-align:left;white-space:nowrap}

/* selos de severidade */
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85em;padding:4px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.d-b .badge,.d-c .badge{border-radius:var(--r-s)}
.d-c .badge{border-width:2px}
.badge.bad{color:var(--danger);background:var(--danger-soft)}
.badge.warn{color:var(--warn);background:var(--warn-soft)}
.badge.ok{color:var(--ok);background:var(--ok-soft)}

/* superfícies */
.surface{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r)}
.d-a .surface.lift{box-shadow:0 1px 2px rgb(16 32 27/.05),0 10px 24px -14px rgb(16 32 27/.22)}
.quote{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82em;overflow-wrap:anywhere}
.d-c .quote{background:var(--p-soft);border:0}
.link{color:var(--p);font-weight:600;text-underline-offset:3px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--p);flex:none}

/* tela principal */
.hero{display:grid;gap:24px;padding:32px 20px}
.hero h3{font-size:clamp(34px,9cqi,56px)}
.hero .sub{font-size:1.1em;color:var(--muted);max-width:44ch}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:var(--dw);color:var(--p);font-size:1.3em;grid-row:span 2}
.steps b{font-weight:700}
.steps span{color:var(--muted);grid-column:2}
.d-c .hero{background:var(--p);color:#fff}
.d-c .hero .sub{color:#fff}
.d-c .hero h3{font-size:clamp(38px,10cqi,72px);text-transform:none}
.d-c .steps{gap:0;border-top:2px solid var(--ink)}
.d-c .steps li{padding:16px 20px;border-bottom:2px solid var(--ink)}
.d-c .stepsbox{padding:0}
.stepsbox{padding:0 20px 28px}
@container (min-width:720px){
  .hero{grid-template-columns:1.1fr .9fr;align-items:center;padding:56px 40px}
  .d-c .hero{grid-template-columns:1fr}
  .stepsbox{padding:0 40px 40px}
  .steps{grid-template-columns:repeat(3,1fr);gap:24px}
  .d-c .steps li{border-bottom:0;border-right:2px solid var(--ink)}.d-c .steps li:last-child{border-right:0}
  .d-c .steps{border-bottom:2px solid var(--ink)}
}

/* marca-texto (direção B) */
.hl{background:linear-gradient(104deg,transparent .5%,var(--hl) 2.5%,var(--hl) 97.5%,transparent 99.5%);padding:.05em .25em;margin-inline:-.25em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 var(--line),0 14px 30px -22px rgb(22 27 51/.35)}
.paper .head{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px dashed var(--line);font-weight:700}
.bill li{display:grid;gap:6px 24px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bill .line{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.bill .note{color:var(--p);font-size:.94em;padding-left:12px;border-left:2px solid var(--p)}
.bill .note b{color:var(--danger)}
.bill .tot{display:flex;justify-content:space-between;padding:14px 16px;font-weight:700;font-size:1.1em}
@container (min-width:720px){.bill li{grid-template-columns:1fr 1fr;align-items:start}}

/* resultado */
.result{display:grid;gap:16px;padding:20px}
.value .num{font-size:clamp(44px,12cqi,68px);display:block}
.items li{padding:14px 16px;border-bottom:var(--bw) solid var(--line);display:grid;gap:6px}
.items li:last-child{border-bottom:0}
.finding{padding:16px;display:grid;gap:12px}
.finding h4{font-size:1.1em;line-height:1.3}
.d-c .value{background:var(--ink);color:#fff;border:0;border-radius:0;margin:-20px -20px 0;padding:28px 20px}
.d-c .value .muted{color:#fff}
@container (min-width:720px){
  .result{padding:32px 40px;gap:24px}
  .d-a .result{grid-template-columns:1fr 320px;align-items:start}
  .d-a .value{grid-column:2;grid-row:1/span 3}
  .d-c .value{margin:-32px -40px 0;padding:44px 40px}
  .d-c .twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
}

/* formulário */
.field{display:grid;gap:6px}
.field label{font-weight:600}
.field input{font:inherit;min-height:48px;padding:10px 14px;border-radius:var(--r-s);border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.d-a .field input,.d-b .field input{border-color:#8b9a94}
.d-b .field input{border-color:#8a8fa6}
.field.err input{border-color:var(--danger);background:var(--danger-soft)}
.field.err p{color:var(--danger);font-weight:600;font-size:.9em}
.drop{border:2px dashed var(--muted);border-radius:var(--r);padding:22px 16px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface)}
.forms{display:grid;gap:16px}
@container (min-width:720px){.forms{grid-template-columns:1fr 1fr}}

/* tokens */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;font-size:13px;line-height:1.3}
.sw i{width:36px;height:36px;border-radius:6px;border:1px solid rgb(0 0 0/.15)}
.sw b{display:block}
.scale li{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.scale small{flex:0 0 108px;font-size:12px;color:var(--muted);font-family:var(--body)}
.scale span{min-width:0;overflow-wrap:anywhere}

/* direção D: estilo da B na disposição da C */
.btn.out{background:transparent;color:#fff;border:1.5px solid #fff}
.btn.out:hover{background:rgb(255 255 255/.14)}
.d-d .nav{background:var(--p);border-bottom:0}
.d-d .brand,.d-d .nav a{color:#fff}
.d-d .brand span{background:linear-gradient(transparent 84%,var(--hl) 84%)}
.d-d .aplus{border-color:#fff;background:transparent;color:#fff}
.d-d .btn.sec{border:1.5px solid var(--p);color:var(--p)}
.d-d .btn.ter{background:var(--hl);color:var(--ink)}
.d-d .badge{border-radius:var(--r-s)}
.d-d .field input{border-color:#8a8fa6}
.d-d .hero{background:var(--p);color:#fff}
.d-d .hero .sub{color:#fff}
.d-d .hero h3{font-size:clamp(36px,9.5cqi,64px)}
.d-d .hero .btn:focus-visible,.d-d .value .btn:focus-visible{outline-color:var(--hl)}
.d-d .paper{color:var(--ink)}
.d-d .steps{gap:0;border-top:1px solid var(--line)}
.d-d .steps li{padding:16px 20px;border-bottom:1px solid var(--line)}
.d-d .stepsbox{padding:0}
.d-d .value{background:var(--p);color:#fff;margin:-20px -20px 0;padding:28px 20px}
.d-d .value .muted{color:#fff}
.d-d .value .hl{color:var(--ink)}
@container (min-width:720px){
  .d-d .steps li{border-bottom:0;border-right:1px solid var(--line)}.d-d .steps li:last-child{border-right:0}
  .d-d .steps{border-bottom:1px solid var(--line)}
  .d-d .value{margin:-32px -40px 0;padding:44px 40px}
  .d-d .twocol{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .d-d .twocol .bill li{grid-template-columns:1fr}
}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--p);--m:var(--p);--l:#fff}
.logo svg,.brand svg{flex:none}
.logo.onp{color:#fff;--m:#fff;--l:var(--p);background:var(--p);padding:10px 14px;border-radius:var(--r-s)}
.d-d .brand{--m:#fff;--l:var(--p)}
.logos{display:grid;gap:16px}
.logos>div{display:grid;gap:8px}
.heroart{position:relative}
.heroart .paper{transform:rotate(-2deg)}
.heroart .pen{position:absolute;right:-4px;bottom:-34px;width:72px;height:auto}
.d-d .steps li::before{content:none}
.d-d .steps svg{grid-row:span 2;align-self:center}
.figs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.figs figure{margin:0;display:grid;gap:8px;justify-items:start}
.figs figcaption{font-size:.85em;color:var(--muted)}
.allclear{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--r);padding:16px}
.allclear>div{min-width:0;flex:1 1 180px}
.taglines{background:var(--sh-panel);border:1px solid var(--sh-line);border-radius:8px;padding:14px 16px}
.taglines h3{margin:0 0 6px;font-size:13px;color:var(--sh-muted);font-weight:600}
.taglines ol{margin:0;padding-left:22px}
#modeSeg,.taglines,.proscons{display:none}body{margin:0}
</style>
</head>
<body>

<div class="wrap intro">
  <h1>Referência visual do HumanoBill</h1>
  <p>Pranchetas da direção aprovada (decisão D23). É uma referência de aparência, não o código do app. As regras estão em <code>docs/07-design-ui.md</code>. Dados da fatura sintética da Vivaz Telecom.</p>
</div>
<div class="bar"><div class="wrap">
  <div class="seg" id="modeSeg" role="group" aria-label="Direção">
    <button type="button" data-mode="a">A · Extrato</button>
    <button type="button" data-mode="b">B · Marca-texto</button>
    <button type="button" data-mode="c">C · Protocolo</button>
    <button type="button" data-mode="d">D · B + C</button>
    <button type="button" data-mode="all">Lado a lado</button>
  </div>
  <div class="seg" id="widthSeg" role="group" aria-label="Largura">
    <button type="button" data-width="desk">Desktop</button>
    <button type="button" data-width="phone">Celular</button>
  </div>
</div></div>
<div class="wrap stage" id="stage" data-mode="all" data-width="desk"><div class="cols" id="cols"></div></div>

<script>
const IC={
 bad:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
 warn:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>',
 ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l2.9 2.9 5.5-6"/></svg>',
 lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
};
const badge=(k,t)=>`<span class="badge ${k}">${IC[k]}${t}</span>`;
const ITEMS=[
 {d:'Plano Vivaz Controle 20GB',v:'R$ 99,90',e:'Mensalidade do seu plano de celular com 20GB de internet.',k:'ok',l:'Tudo certo'},
 {d:'Clube Vivaz Música',v:'R$ 12,90',e:'Assinatura extra de música, cobrada à parte do plano.',k:'bad',l:'Indevido',n:'Você disse que não contratou.'},
 {d:'Seguro Tela',v:'R$ 9,90',e:'Seguro extra para a tela do aparelho, cobrado à parte.',k:'bad',l:'Indevido',n:'Você disse que não contratou.'}
];
const DIRS={
 a:{name:'A · Extrato',idea:'Fintech refinada. É o visual de hoje, com acabamento: verde-garrafa, uma família tipográfica, menos caixas e um resumo fixo ao lado no desktop.',
    pro:'Menor risco e menor retrabalho (cerca de meio dia). Mantém o verde de dinheiro de volta.',con:'É a menos memorável. Lembra muitas fintechs.',
    fonts:'Geist em tudo',
    pal:[['Primária','#0B5D4B'],['Primária forte','#084436'],['Primária suave','#E3F1EC'],['Fundo','#F6F8F7'],['Superfície','#FFFFFF'],['Texto','#10201B'],['Texto secundário','#4D5F58'],['Linha','#D9E2DE'],['Erro','#B42318'],['Atenção','#8A4B08'],['Sucesso','#15683A'],['Info','#0B5D4B']]},

    fonts:'Archivo (largura expandida nos títulos)',
    pal:[['Primária','#1F3FD6'],['Primária forte','#162FA6'],['Primária suave','#E7ECFF'],['Fundo e superfície','#FFFFFF'],['Texto e bordas','#0A1230'],['Texto secundário','#454C66'],['Erro','#D92D20'],['Atenção','#B25E09'],['Sucesso','#177245'],['Info','#1F3FD6']]}

  pro:'Junta a identidade própria da B com a leitura direta da C. O amarelo vira a cor de ação sobre o azul.',con:'Cerca de 1,5 dia. O azul ocupa mais área, então o amarelo precisa ficar só nas ações e no que é indevido.',

 envie:`<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="10" fill="#FFE45C"/><g ${S}><rect x="11" y="5" width="26" height="38" rx="3"/><path d="M24 31V17M18 23l6-6 6 6"/></g></svg>`,
 entenda:`<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="17" width="20" height="7" rx="1" fill="#FFE45C"/><g ${S}><rect x="6" y="5" width="28" height="36" rx="3"/><path d="M12 12h16M12 20.5h16M12 29h8"/><path d="M27 27h15v11h-5l-4 4v-4h-6z" fill="#fff"/></g></svg>`,

};
const LOGO_NAMES={1:'Logo: recibo grifado'};
const art=()=>`<div class="pad stack" style="gap:24px">
 <div class="logos">${[1].map(n=>`<div><span class="muted small">${LOGO_NAMES[n]}</span><div class="row" style="gap:14px"><span class="logo">${MARK[n]}HumanoBill</span><span class="logo onp">${MARK[n]}HumanoBill</span><span class="logo">${MARK[n]}</span></div></div>`).join('')}</div>
 <div class="figs">${[['envie','Passo 1, envie'],['entenda','Passo 2, entenda'],['conteste','Passo 3, conteste']].map(f=>`<figure>${FIG[f[0]]}<figcaption>${f[1]}</figcaption></figure>`).join('')}</div>
 <div class="allclear">${FIG.ok}<div><b style="font-family:var(--display);font-size:1.3em;color:var(--ok)">Tudo certo com esta conta</b><p>Não achei nada fora do lugar nos itens abaixo.</p></div></div>
</div>`;
const stepsHtml=d=>{const T=[['envie','Envie','Mande o PDF ou uma foto da sua fatura.'],['entenda','Entenda','Cada item explicado em português simples.'],['conteste','Conteste','Se algo parecer errado, você leva o texto pronto.']];
 return `<ol class="steps">${T.map((t,i)=>`<li>${d==='d'?FIG[t[0]]:''}<b>${d==='d'?(i+1)+'. ':''}${t[1]}</b><span>${t[2]}</span></li>`).join('')}</ol>`};
const rgb=h=>{const n=parseInt(h.slice(1),16);return `rgb(${n>>16}, ${n>>8&255}, ${n&255})`};

const nav=d=>`<div class="nav"><span class="brand">${d==='d'?MARK[1]:''}<span>HumanoBill</span></span><a href="#">Como funciona</a><a href="#">Privacidade</a><button type="button" class="aplus" aria-label="Aumentar o texto">A+</button></div>`;

const heroSide={

    <div><span class="muted small">Parece indevido</span><div class="disp" style="font-size:40px">R$ 22,80</div></div>
    <ul class="stack" style="gap:8px">${ITEMS.map(i=>`<li class="between"><span>${i.d}</span>${badge(i.k,i.l)}</li>`).join('')}</ul></div>`,
 b:`<div class="paper"><div class="head"><span>Vivaz Telecom</span><span class="muted">10/2026</span></div>

    <li style="grid-template-columns:1fr"><div class="line"><span class="hl">SEG TELA</span><span class="hl">9,90</span></div><p class="note">Seguro da tela, cobrado à parte.</p></li></ul>
    <div class="tot"><span>Total</span><span>R$ 122,70</span></div></div>`,
 c:''

  <p class="row small" style="gap:6px">${IC.lock} Seus dados pessoais não são guardados.</p></div>${heroSide[d]}</div>

  <p class="muted">A operadora não pode cobrar por um serviço que você não pediu.</p>
  <div class="quote">CLUBE VZ MUS 12,90<br><span style="opacity:.7">Trecho original, página 1</span></div>
  <p>Base legal: <a class="link" href="#">CDC art. 39, III</a></p>
  <label class="check"><input type="checkbox" checked> Incluir na contestação</label></article>`;
const itemsList=`<div><h4 style="margin-bottom:10px;font-size:1.15em">Sua conta explicada</h4><ul class="surface items">${ITEMS.map(i=>`<li><div class="between"><b>${i.d}</b><b class="nowrap">${i.v}</b></div><p class="muted">${i.e}</p><div>${badge(i.k,i.l)}</div></li>`).join('')}</ul></div>`;
const billB=`<div class="paper"><div class="head"><span>Vivaz Telecom</span><span class="muted">Outubro de 2026</span></div><ul class="bill">${ITEMS.map(i=>`<li><div class="line"><span${i.k==='bad'?' class="hl"':''}>${i.d}</span><span class="nowrap${i.k==='bad'?' hl':''}">${i.v}</span></div><p class="note">${i.e}${i.n?` <b>${i.n}</b>`:''}</p></li>`).join('')}</ul><div class="tot"><span>Total da fatura</span><span>R$ 122,70</span></div></div>`;
const value=d=>({
 a:`<section class="surface lift pad stack value"><div><span class="muted">Parece indevido</span><span class="disp num">R$ 22,80</span><span class="muted">em 2 cobranças desta fatura de R$ 122,70</span></div><button type="button" class="btn pri">Contestar agora</button><button type="button" class="btn sec">Já paguei esta fatura</button><p class="muted small">Conteúdo informativo, não é orientação jurídica.</p></section>`,
 b:`<section class="stack value"><p class="disp" style="font-size:clamp(30px,8cqi,48px)"><span class="hl">R$ 22,80</span> desta conta parecem indevidos</p><p class="muted">São 2 cobranças na fatura de R$ 122,70. Se você já pagou, a devolução pode ser em dobro.</p><div class="row"><button type="button" class="btn pri">Contestar agora</button><button type="button" class="btn sec">Já paguei esta fatura</button></div></section>`,
 c:`<section class="stack value"><div><span class="muted">Parece indevido</span><span class="disp num">R$ 22,80</span><span class="muted">em 2 cobranças desta fatura de R$ 122,70</span></div><div class="row"><button type="button" class="btn inv">Contestar agora</button><button type="button" class="btn pri">Já paguei esta fatura</button></div></section>`,
 d:`<section class="stack value"><div><span class="muted">Parece indevido</span><span class="disp num"><span class="hl">R$ 22,80</span></span><span class="muted">em 2 cobranças desta fatura de R$ 122,70</span></div><div class="row"><button type="button" class="btn ter">Contestar agora</button><button type="button" class="btn out">Já paguei esta fatura</button></div></section>`
})[d];
heroSide.d=`<div class="heroart">${heroSide.b}${PEN}</div>`;
const result=d=>`${nav(d)}<div class="result">${value(d)}${d==='d'?`<div class="twocol stack">${finding}<div><h4 style="margin-bottom:10px;font-size:1.15em">Sua conta explicada</h4>${billB}</div></div>`:d==='b'?billB+finding:d==='c'?`<div class="twocol stack">${finding}${itemsList}</div>`:finding+itemsList}</div>`;

const ST=[['Normal',''],['Hover','is-hover'],['Foco','is-focus'],['Pressionado','is-active'],['Desativado','dis'],['Carregando','load']];
const V=[['Primary','pri','Analisar'],['Secondary','sec','Tirar foto'],['Tertiary','ter','Copiar texto'],['Ghost','gho','Corrigir dados']];
const kit=()=>`<div class="pad stack" style="gap:22px">
  <div class="states"><table><tr><th></th>${ST.map(s=>`<th>${s[0]}</th>`).join('')}</tr>${V.map(v=>`<tr><th>${v[0]}</th>${ST.map(s=>`<td><button type="button" class="btn ${v[1]} ${s[1].startsWith('is')?s[1]:''}" ${s[1]==='dis'?'disabled':''} style="white-space:nowrap">${s[1]==='load'?'<span class="spin" aria-hidden="true"></span>Aguarde':v[2]}</button></td>`).join('')}</tr>`).join('')}</table></div>
  <div class="row">${badge('bad','Indevido')}${badge('warn','Suspeito, confira')}${badge('ok','Tudo certo')}</div>

   <div class="field"><label>E-mail para o lembrete</label><input type="email" value="maria@exemplo.com" aria-label="E-mail para o lembrete"></div>

   <div class="field err"><label>Número do protocolo</label><input type="text" value="2026#88*1" aria-label="Número do protocolo" aria-invalid="true"><p>Use só letras, números, ponto, hífen e barra.</p></div>

</div>`;
const SCALE=[['Display','56/1.05',56],['H1','40/1.1',40],['H2','30/1.15',30],['H3','22/1.25',22],['H4','18/1.3',18]];
const tokens=d=>`<div class="pad stack" style="gap:22px"><ul class="sw">${DIRS[d].pal.map(p=>`<li><i style="background:${p[1]}"></i><span><b>${p[0]}</b>${p[1]}<br>${rgb(p[1])}</span></li>`).join('')}</ul>
  <div><p class="muted small" style="margin-bottom:6px">${DIRS[d].fonts}</p><ul class="scale">${SCALE.map(s=>`<li><small>${s[0]} ${s[1]}</small><span class="disp" style="font-size:min(${s[2]}px,11cqi)">R$ 22,80 de volta</span></li>`).join('')}
  <li><small>Body ${d==='b'||d==='d'?'17':'16'}/1.5</small><span>Isso parece um serviço extra que você pode não ter contratado.</span></li>
  <li><small>Caption 13/1.4</small><span style="font-size:13px" class="muted">Este resultado expira em 30 dias.</span></li></ul></div></div>`;

const col=d=>`<section class="col" data-dir="${d}"><header><h2>${DIRS[d].name}</h2><p>${DIRS[d].idea}</p></header>${DIRS[d].extra||''}
 <p class="cap">Tela principal</p><div class="board d-${d}">${hero(d)}</div>
 ${d==='d'?`<p class="cap">Logo e ilustrações</p><div class="board d-d">${art()}</div>`:''}
 <p class="cap">Resultado</p><div class="board d-${d}">${result(d)}</div>
 <p class="cap">Botões, selos e formulário</p><div class="board d-${d}">${kit()}</div>
 <p class="cap">Cores e tipografia</p><div class="board d-${d}">${tokens(d)}</div>
 <div class="proscons"><div><h3>Vantagens</h3><p>${DIRS[d].pro}</p></div><div><h3>Desvantagens</h3><p>${DIRS[d].con}</p></div></div></section>`;

const stage=document.getElementById('stage'),cols=document.getElementById('cols');
cols.innerHTML=['d'].map(col).join('');
cols.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});
let st={mode:'d',width:'desk'};
try{Object.assign(st,JSON.parse(localStorage.getItem('hb-ref')||'{}'))}catch(e){}
function apply(){st.mode='d';
  stage.dataset.mode=st.mode;stage.dataset.width=st.width;
  cols.querySelectorAll('.col').forEach(c=>{c.hidden=st.mode!=='all'&&c.dataset.dir!==st.mode});
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===st.mode));
  document.querySelectorAll('#widthSeg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.width===st.width);b.disabled=st.mode==='all'});
  try{localStorage.setItem('hb-ref',JSON.stringify(st))}catch(e){}
}
document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.mode=b.dataset.mode;apply()}});
document.getElementById('widthSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.width=b.dataset.width;apply()}});
apply();
</script>
</body>
</html>
