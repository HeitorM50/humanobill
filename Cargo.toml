[workspace]
resolver = "3"
members = ["crates/core", "crates/rules", "crates/extract", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Heitor"]
repository = "https://github.com/HeitorM50/humanobill"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
