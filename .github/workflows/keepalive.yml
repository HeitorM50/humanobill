name: Keep-alive

# Reserva do UptimeRobot: mantém a API (Render free) e o banco (Supabase free) acordados.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Variável API_URL não configurada"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 "$API_URL/health"
