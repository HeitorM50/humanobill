name: Lembretes

# Uma vez por dia chama a API, que envia os lembretes vencidos (RF18) e apaga o e-mail de cada um.
on:
  schedule:
    - cron: "0 12 * * *" # 12h UTC = 9h em Brasília
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar lembretes vencidos
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets API_URL e CRON_SECRET não configurados"; exit 0; fi
          # O Render free pode estar dormindo: tenta de novo com espera. A resposta só traz contagens.
          curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 90 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_URL/internal/reminders/dispatch"
